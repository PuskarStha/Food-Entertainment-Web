<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Pristine circular white background -->
  <circle cx="256" cy="256" r="230" fill="#FFFFFF" stroke="#86EFAC" stroke-width="12" />
  
  <!-- Shadow/Effects -->
  <circle cx="256" cy="256" r="224" fill="none" stroke="#D1FAE5" stroke-width="4" opacity="0.5" />
  
  <!-- Main Clapperboard Group -->
  <g transform="translate(136, 170)">
    <!-- Clapperboard Base (for movies/series) -->
    <path d="M10 70 h220 v90 a20 20 0 0 1 -20 20 h-180 a20 20 0 0 1 -20 -20 z" fill="#1B4332" />
    
    <!-- Chalk Lines on Clapperboard Base -->
    <rect x="30" y="90" width="180" height="4" rx="2" fill="#FAF9F6" opacity="0.3" />
    <rect x="30" y="110" width="120" height="4" rx="2" fill="#FAF9F6" opacity="0.3" />
    <rect x="30" y="130" width="150" height="4" rx="2" fill="#FAF9F6" opacity="0.3" />
    
    <!-- Pivoted Clapper Top (Spoon Pivoted!) -->
    <g transform="translate(15, 65) rotate(-22)">
      <!-- Top Bar of Clapperboard -->
      <path d="M-5 -20 h230 v16 h-230 z" fill="#2D3748" />
      <!-- Stripes on Top Bar -->
      <path d="M 20 -20 L 35 -4 M 60 -20 L 75 -4 M 100 -20 L 115 -4 M 140 -20 L 155 -4 M 180 -20 L 195 -4" stroke="#FAF9F6" stroke-width="6" stroke-linecap="round" />
      
      <!-- Pivoted Yellow Spoon serving as part of clapper -->
      <g transform="translate(50, -42)">
        <!-- Spoon handle -->
        <path d="M -15 8 C -5 8, 85 4, 110 5 C 110 2, 110 -2, 110 -2 C 85 -1, -5 5, -15 5 Z" fill="#F59E0B" />
        <!-- Spoon bowl -->
        <ellipse cx="140" cy="5" rx="32" ry="18" fill="#F59E0B" transform="rotate(-5, 140, 5)" />
        <ellipse cx="136" cy="3" rx="26" ry="13" fill="#FCD34D" transform="rotate(-5, 140, 5)" />
        <path d="M 115 5 C 122 -3, 145 -3, 155 5" stroke="#FFFFFF" stroke-width="2" fill="none" opacity="0.6" />
      </g>
    </g>
    
    <!-- Clapper pivot joint bolt -->
    <circle cx="15" cy="65" r="8" fill="#D1D5DB" />
    <circle cx="15" cy="65" r="4" fill="#4B5563" />
  </g>
</svg>
